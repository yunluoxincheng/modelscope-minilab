name: build-and-push-docker-web

# 构建 Web 前端多架构（amd64 + arm64）镜像并推送到 Docker Hub。
# 与后端镜像共用同一组仓库 Secrets：
#   DOCKERHUB_USERNAME  Docker Hub 用户名（yunluoxincheng）
#   DOCKERHUB_TOKEN     Docker Hub Access Token（read/write/push）

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/docker-publish-web.yml'
  workflow_dispatch:
    inputs:
      extra_tag:
        description: '额外镜像 tag（如 v1.0.0，留空则不加）'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/modelscope-minilab-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build and push（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Web 前端镜像已推送" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "镜像：\`${{ secrets.DOCKERHUB_USERNAME }}/modelscope-minilab-web\`" >> $GITHUB_STEP_SUMMARY
          echo "架构：linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "Tags：latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "服务器拉取：\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/modelscope-minilab-web:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
