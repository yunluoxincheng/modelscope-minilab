# 智模工坊 Web 端 nginx 配置（容器内）
# 1) 托管 Vue SPA 静态资源（history 路由回退到 index.html）
# 2) 把 /api/ 反代到 compose 网络里的 backend 服务 —— 这样宿主机 nginx
#    只需要一条 location / 指到本容器即可，前端与接口天然同源、无 CORS 问题。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 上传上限略大于后端 5MB 限制；直连本容器（如本地 compose 调试）时生效
    client_max_body_size 6m;

    # API 反代：指向 docker-compose 网络中的 backend 服务
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 带哈希指纹的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
